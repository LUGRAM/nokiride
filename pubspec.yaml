name: nokiride
description: "NokiRide — Mobilité urbaine simplifiée à Libreville"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0
 
dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  get: ^4.7.3
  get_storage: ^2.1.1

  # UI
  google_fonts: ^7.0.2
  lottie: ^3.3.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0

  # Images
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  image_cropper: ^11.0.0

  # Storage & data
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.4

  # Utils
  intl: ^0.20.2
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/carousel/
    - assets/images/carousell/
